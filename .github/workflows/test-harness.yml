name: audit-collector-test-harness

# Runs the Docker test harness (test/) on an x64 runner, so the FULL matrix -
# el6/el7 included - runs natively. Current distros are required; the EOL bucket
# is best-effort (continue-on-error), matching the "backlog if it fights" policy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The harness only ever reads the repo and talks to the local docker daemon.
permissions:
  contents: read

jobs:
  current:
    name: current distros (required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run harness (current distros)
        working-directory: test
        run: ./run.sh -m "not eol" --tb=short

  # continue-on-error is deliberate: the EOL bucket is KNOWN not to converge
  # today (el7/ubuntu-18.04/20.04 ship a python3 older than ansible-core's floor,
  # and the EOL Ubuntu bakes need apt pointed at old-releases). Without it, CI is
  # permanently red and stops meaning anything. The cost is that this job can
  # stay broken unnoticed -- it is not a required check and nothing reports on it.
  # See docs/SUPPORTED-DISTROS.md "Known gaps"; the fix is tracked separately.
  eol:
    name: EOL distros (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run harness (EOL bucket, best-effort)
        working-directory: test
        run: ./run.sh -m "eol" --tb=short
