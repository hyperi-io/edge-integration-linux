name: audit-collector-test-harness

# GitHub-hosted runners by default. GH_RUNNER_MODE=self-hosted (hyperi-ci's
# variable) selects the self-hosted runner instead. Fork PRs run their own copy
# of this file, so the runner group's repository access is what keeps them off.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ${{ (vars.GH_RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && (vars.GH_RUNNER_PYTHON || vars.GH_RUNNER_DEFAULT) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the lint toolchain
        working-directory: test
        run: uv sync --locked --group lint
      - name: ansible-lint
        run: test/.venv/bin/ansible-lint
      - name: ruff and ty
        working-directory: test
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
          .venv/bin/ty check
      - name: shellcheck
        run: test/.venv/bin/shellcheck build-tarball.sh test/run.sh test/lab/*.sh
      - name: hadolint
        run: test/.venv/bin/hadolint test/images/Dockerfile.* test/receiver/Dockerfile
      - name: actionlint
        run: test/.venv/bin/actionlint

  # Loads every rendered ruleset into the runner's own kernel (a disposable VM)
  # and fires each detection. Always GitHub-hosted: it needs sudo and a kernel
  # nothing else shares.
  kernel:
    name: kernel (rules load and fire)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install auditd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q auditd
          sudo systemctl start auditd
      - name: Load and fire the rulesets
        working-directory: test
        env:
          HYPERI_AUDIT_KERNEL_TESTS: "1"
        run: uv run --locked pytest -m kernel test_kernel.py --tb=short

  # One job per bucket. EOL is best-effort (continue-on-error): el7 and Ubuntu
  # 18.04/20.04 ship a python3 below ansible-core's target floor, so that job
  # stays red until docs/supported-distros.md "Known gaps" is closed.
  harness:
    name: harness (${{ matrix.bucket }})
    needs: lint
    runs-on: ${{ (vars.GH_RUNNER_MODE == 'self-hosted' && !github.event.pull_request.head.repo.fork) && (vars.GH_RUNNER_IMAGE_BUILDER || vars.GH_RUNNER_DEFAULT) || 'ubuntu-latest' }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.bucket == 'eol' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bucket: current
            select: not eol
          - bucket: eol
            select: eol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Use the Docker Hub mirror where it is reachable
        # The mirror is reachable from self-hosted runners only.
        if: vars.HYPERCI_DOCKERHUB_MIRROR != '' && runner.environment == 'self-hosted'
        env:
          MIRROR: ${{ vars.HYPERCI_DOCKERHUB_MIRROR }}
        run: |
          hostport="${MIRROR%%/*}"
          host="${hostport%:*}"
          port=443
          [[ "$hostport" == *:* ]] && port="${hostport##*:}"
          if timeout 3 bash -c ": </dev/tcp/$host/$port" 2>/dev/null; then
            echo "HYPERCI_DOCKERHUB_MIRROR=$MIRROR" >> "$GITHUB_ENV"
          else
            echo "::notice::$hostport is unreachable from this runner, so the harness pulls from Docker Hub"
          fi
      - name: Run the harness
        working-directory: test
        env:
          SELECT: ${{ matrix.select }}
        run: ./run.sh -m "$SELECT" --tb=short
