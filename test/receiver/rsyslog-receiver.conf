# Test harness receiver: a complete rsyslog.conf. Each listener is named, and the
# name starts every line it writes, so a test can tell which port a marker came in on.
global(
    workDirectory="/var/spool/rsyslog"
    defaultNetstreamDriverCAFile="/etc/hyperi-tls/ca.pem"
    defaultNetstreamDriverCertFile="/etc/hyperi-tls/server.pem"
    defaultNetstreamDriverKeyFile="/etc/hyperi-tls/server.key"
)

module(load="imtcp")
input(type="imtcp" port="12201" name="audit")
input(type="imtcp" port="12205" name="syslog")
input(type="imtcp" port="6514" name="tls"
      streamDriver.name="gtls" streamDriver.mode="1" streamDriver.authMode="anon")

module(load="imrelp")
input(type="imrelp" port="20514" name="relp")

# "<listener> <source-host> <tag><message>". Each test seeds a run-unique marker.
template(name="hyperi_received" type="string" string="%inputname% %HOSTNAME% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/var/log/hyperi-received/received.log" template="hyperi_received")
