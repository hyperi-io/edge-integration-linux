# HyperI Linux audit collector - test harness central syslog receiver.
# Complete rsyslog.conf. One instance persists across the whole chained run;
# every OS-under-test forwards here. Listens for forwarded audit records (12201)
# and general syslog (12205) over plain TCP, and RELP (20514), then appends every
# message to one received.log that the pytest assertions grep. Ports the central
# collector of the old VM regime; imrelp is a stock RELP receiver, so the plain
# relp transport is proven end to end without HyperI's own receivers.
global(workDirectory="/var/spool/rsyslog")

module(load="imtcp")
input(type="imtcp" port="12201")
input(type="imtcp" port="12205")

module(load="imrelp")
input(type="imrelp" port="20514")

# Flat, greppable: "<source-host> <tag><message>" per line. Each OS seeds a
# unique marker (HYPERI_HARNESS_MARKER_<distro>) so a test greps only its own
# lines out of the shared, run-long received.log.
template(name="hyperi_received" type="string" string="%HOSTNAME% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/var/log/hyperi-received/received.log" template="hyperi_received")
