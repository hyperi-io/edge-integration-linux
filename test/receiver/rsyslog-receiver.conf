# Test harness receiver: a complete rsyslog.conf. Listens for audit (TCP 12201),
# syslog (TCP 12205) and RELP (20514), and appends every message to one log the
# tests search. imrelp is a stock RELP listener, so plain RELP is tested end to end.
global(workDirectory="/var/spool/rsyslog")

module(load="imtcp")
input(type="imtcp" port="12201")
input(type="imtcp" port="12205")

module(load="imrelp")
input(type="imrelp" port="20514")

# One line per message: "<source-host> <tag><message>". Each test seeds a
# run-unique marker and searches for it alone.
template(name="hyperi_received" type="string" string="%HOSTNAME% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/var/log/hyperi-received/received.log" template="hyperi_received")
