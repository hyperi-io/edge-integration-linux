[project]
name = "hyperi-audit-harness"
version = "0.0.0"
description = "Docker test harness for the hyperi_audit Ansible role"
requires-python = ">=3.14"
dependencies = [
    "ansible-core>=2.22",
    "pytest>=9.2",
    "pyyaml>=6",
]

[dependency-groups]
lint = [
    "actionlint-py>=1.7.12.25",
    "ansible-lint>=26.11",
    "hadolint-py>=2.15.1.3",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "ty>=0.0.100",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "D", "PT", "SIM", "RUF"]
ignore = [
    "D100",  # test modules carry a module docstring where one adds something
    "D103",  # test names state the scenario
    "S101",  # assert is the pytest mechanism
    "S603",  # every subprocess call takes a fixed argv, never a shell string
    "S607",  # docker and ansible-playbook resolve from PATH by design
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["collections", ".venv", "images", "receiver"]
markers = [
    "eol: end-of-life distro target, run as a best-effort CI job",
    "kernel: loads audit rules into the host kernel (HYPERI_AUDIT_KERNEL_TESTS=1)",
]
