[project]
name = "hyperi-audit-harness"
version = "0.0.0"
description = "Docker test harness for the HyperI Linux audit collector role"
# The control node needs python 3.11+ so uv resolves a non-EOL ansible-core
# (target distros keep their own ansible_python_interpreter). This drops the
# ansible-core 2.17.x resolution branch that carries CVE-2026-11332.
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "ansible-core>=2.16",
    "docker>=7",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra -v"
# Discover every test_*.py in this directory. Naming a single file here means any
# test added later is silently never collected -- which is exactly what happened
# to the profile-selection tests.
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["collections", ".venv", "*.egg", "images", "receiver"]
markers = ["eol: end-of-life distro target (best-effort, may be backlogged)"]
