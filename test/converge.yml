---
# HyperI Linux audit collector - test harness converge.
# Applies the audit collector role to the OS-under-test container in CONFIG-ONLY
# mode: hyperi_audit_start_services=false makes the role write auditd.conf, the rules
# file and the rsyslog forwarder WITHOUT enabling/starting services (which need
# an init the plain test container does not run). The harness then starts
# rsyslogd manually and seeds audit.log to prove forwarding. collector_address
# and hyperi_audit_level are passed as extra-vars by the pytest harness.
- hosts: all
  gather_facts: true
  become: true
  vars:
    hyperi_audit_start_services: false
  roles:
    - role: hyperi_audit
