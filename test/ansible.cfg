# Test harness ansible config. run.sh installs the collections into ./collections.
[defaults]
roles_path = ../roles
filter_plugins = ../roles/hyperi_audit/filter_plugins
collections_path = ./collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
gathering = smart
stdout_callback = default

[ssh_connection]
pipelining = True
