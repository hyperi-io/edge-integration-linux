---
# Collections the harness needs, installed into ./collections by run.sh.
#   community.docker  - the docker connection plugin (converge over `docker exec`)
#   community.general - the zypper module behind ansible.builtin.package on SUSE
collections:
  - name: community.docker
    version: "5.4.0"
  - name: community.general
    version: "14.0.1"
