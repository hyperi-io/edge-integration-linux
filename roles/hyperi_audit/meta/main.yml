---
galaxy_info:
  role_name: hyperi_audit
  namespace: hyperi
  author: HyperI
  description: Ansible role that audits Linux hosts with auditd and forwards audit and syslog to EdgeStream Hub or any syslog receiver.
  license: Apache-2.0
  min_ansible_version: "2.12"
  platforms:
    - name: EL
      versions: ["6", "7", "8", "9", "10"]
    - name: Debian
      versions: [bookworm, trixie]
    - name: Ubuntu
      versions: [bionic, focal, noble]
    - name: Amazon Linux
      versions: ["2023"]
    - name: opensuse
      versions: [all]
  galaxy_tags: [auditd, rsyslog, security, siem, logging]
dependencies: []
