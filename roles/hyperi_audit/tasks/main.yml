---
- name: Deploy the audit ruleset and the rsyslog forwarder
  become: true
  block:
    - name: Validate the role inputs
      ansible.builtin.import_tasks: validate.yml

    - name: Install rsyslog, auditd and the transport modules
      ansible.builtin.import_tasks: install.yml

    - name: Configure the rsyslog forwarder
      ansible.builtin.import_tasks: rsyslog.yml

    - name: Configure auditd and its ruleset
      ansible.builtin.import_tasks: auditd.yml

    - name: Let rsyslog read the audit log under SELinux
      ansible.builtin.import_tasks: selinux.yml
      when: hyperi_audit_selinux_enabled | bool

    - name: Collect the restart requests from the tasks above
      ansible.builtin.meta: flush_handlers

    - name: Restart the services and load the rules
      ansible.builtin.import_tasks: services.yml
      when: hyperi_audit_start_services | bool
