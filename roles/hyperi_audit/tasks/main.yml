---
# HyperI tasks file for Linux Audit deployment to collector
# License:      BUSL-1.1
# Copyright:    (c) 2026 HYPERI PTY LIMITED
#
# v2.6      2026-07-16      Restored the multi-profile ruleset (low / medium /
#                           high + internet use-case overlay), selected via the
#                           hyperi_audit_level and hyperi_audit_use_case role variables.
#                           Daemon CPU/concurrency tuning recovered from the
#                           PaaS collector line: priority_boost 8 -> tiered
#                           (2 low / 4 medium+high), added flush + freq. Pairs
#                           with the --backlog_wait_time 0 kernel fix now in the
#                           rules files. Kept the ENRICHED/RAW + rules.d gating.
# v2.5.1    2022-11-22      Moved ansible module use for SELinix for rsyslog port to
#                           shell execution to reduce ansible/python/lib interdepencencies
#                           for older/unsupported distro releases
# v2.5      2022-11-21      Force rsyslog-only audit delivery w/o audisp
#                           Corrections for selinux edge cases on older distro releases
#                           Late release RHEL stream support (audisp being deprecated)
#                           Immutable auditd check for idempotent execution
# v2.4      2022-10-26      Updates for RHEL6 and below and other EOLife distros
# v2.3      2022-09-28      Old release distro support
# v2.2      2022-09-26      TD fork
# v2.1      2022-08-08      HyperI core current version

- name: Run as root
  block:

  - name: Ensure collector_address is set
    fail: msg="Collector_address is not set"
    when: not collector_address

  - name: Log linux distro
    debug:
      msg: "Linux distribution is {{ ansible_distribution }}, major version is {{ ansible_distribution_major_version }}"

  - name: Set auditd profile level default (medium)
    set_fact:
      hyperi_audit_level: "medium"
    when: hyperi_audit_level is undefined

  - name: Fail on an unknown auditd profile level
    fail:
      msg: "hyperi_audit_level must be one of low|medium|high (got '{{ hyperi_audit_level }}')"
    when: hyperi_audit_level not in ['low', 'medium', 'high']

  - name: Log auditd profile selection
    debug:
      msg: "auditd profile level is {{ hyperi_audit_level }}, use-case overlay is {{ hyperi_audit_use_case | default('none') }}"

  - name: Populate service facts
    service_facts:

  - name: Set auditd package default
    set_fact:
      auditd_package: audit

  - name: Set auditd package = audit for Ubuntu/SLES/Debian
    set_fact:
      auditd_package: auditd
    when: ansible_distribution == 'Ubuntu' or ansible_distribution == 'SLES' or ansible_distribution == 'Debian'

  - name: Install rsyslog, audit
    package:
      name:
        - rsyslog
        - "{{ auditd_package }}"
      state: latest
    register: install_res
    retries: 6
    delay: 10
    until: install_res is success

  - name: Install SELinux dependencies
    block:

    - name: Install policycoreutils
      package:
        name:
          - policycoreutils
        state: latest
      when: ansible_selinux is defined and ansible_selinux != False and ansible_selinux.status == 'enabled'

    - name: Install policycoreutils-devel
      package:
        name:
          - policycoreutils-devel
        state: latest
      failed_when: False

    - name: Install policycoreutils-python-utils
      package:
        name:
          - policycoreutils-python-utils
        state: latest
      failed_when: False

    - name: Install policycoreutils-python
      package:
        name:
          - policycoreutils-python
        state: latest
      failed_when: False

    - name: Install libselinux-python
      package:
        name:
          - libselinux-python
        state: latest
      failed_when: False

    when: ansible_selinux is defined and ansible_selinux != False and ansible_selinux.status == 'enabled'

  - name: Get rsyslogd major version
    shell: "rsyslogd -v | head -1 | sed 's,[^0-9.]*,,g' | head -c 1"
    register: rsyslogd_major_version_out

  - name: Set rsyslogd major version fact
    set_fact:
      rsyslogd_major_version: "{{ rsyslogd_major_version_out.stdout }}"

  - name: Log rsyslogd version
    debug:
      msg: "RSyslog major version is {{ rsyslogd_major_version }}"

  - name: Get daemon type
    shell: "ps -p 1 o comm="
    register: daemon_type_out

  - name: Set daemon type fact
    set_fact:
      daemon_type: "{{ daemon_type_out.stdout }}"

  - name: Log daemon type
    debug:
      msg: "Deamon type is {{ daemon_type }}"

  # Ask the KERNEL whether the audit config is locked, rather than grepping
  # /etc/audit/rules.d for "-e 2". The file-based check detected ITSELF: every
  # ruleset this role ships ends with "-e 2", so from the second deploy onward it
  # found the previous run's own hyperi-audit.rules, concluded the host was
  # immutable, and skipped the auditd restart -- silently stranding every config
  # change (the priority_boost/flush/freq CPU fix included) until an unrelated
  # reboot. The live kernel state is also the more truthful question: what matters
  # is whether auditd will actually accept a stop/start now, not what some file on
  # disk asks for.
  #
  # Output format differs across the supported range, so match BOTH forms:
  #   auditd 2.x (el6/el7 floor):  AUDIT_STATUS: enabled=2 flag=1 pid=...
  #   auditd 3.x+:                 enabled 2
  # A failure here (auditctl absent, or no audit netlink -- e.g. inside a
  # container) leaves rc non-zero, so the fact is false and we take the normal
  # restart path. That is the safe default: the pre-existing behaviour when the
  # old find matched nothing.
  - name: Check the live auditd immutable state
    shell: "auditctl -s 2>/dev/null | grep -qE 'enabled[ =]2'"
    register: auditd_immutable_out
    changed_when: false
    failed_when: false

  - name: Set found immutable auditd fact
    set_fact:
      found_immutable_auditd: "{{ auditd_immutable_out.rc == 0 }}"

  # Diagnostic only -- this fact NO LONGER gates the auditd restart. See the
  # service block at the bottom of this file for why.
  - name: Log found immutable auditd fact
    debug:
      msg: >-
        Immutable audit configuration found: {{ found_immutable_auditd }}.
        {% if found_immutable_auditd %}
        The kernel audit config is LOCKED (enabled=2), so the new audit RULES
        (--backlog_wait_time included) CANNOT load until this host reboots.
        The auditd.conf tuning still applies on the restart later in this run.
        {% endif %}

  - name: Set rsyslogd legacy flag on/off
    set_fact:
      rsyslog_legacy: "{{ '-legacy' if rsyslogd_major_version < '7' else '' }}"

  - name: Ensure /etc/rsyslog.d exists
    file:
      path: /etc/rsyslog.d
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Ensure /etc/rsyslog.d configurations are read irrespective of rsyslog version
    lineinfile:
      path: /etc/rsyslog.conf
      insertafter: EOF
      line: "$IncludeConfig /etc/rsyslog.d/*.conf"
      state: present

  - name: Build 99-hyperi-rsyslog.conf
    template:
      src: "99-hyperi-rsyslog{{ rsyslog_legacy }}.j2"
      dest: /etc/rsyslog.d/99-hyperi-rsyslog.conf
      owner: root
      group: root
      mode: '0644'

  - name: Find distro specific deployed auditd.conf
    find:
      paths: /etc
      patterns: "auditd.conf"
      recurse: True
    register: auditd_path

  - name: Get auditd major version
    shell: "auditctl -v | head -1 | sed 's,[^0-9.]*,,g' | head -c 1"
    register: auditd_major_version_out

  - name: Cast auditd major version
    set_fact:
      auditd_major_version: "{{ auditd_major_version_out.stdout }}"

  - name: Get auditd major_minor version
    shell: "auditctl -v | head -1 | sed 's,[^0-9.]*,,g' | head -c 3"
    register: auditd_major_minor_version_out

  - name: Cast auditd major_minor version
    set_fact:
      auditd_major_minor_version: "{{ auditd_major_minor_version_out.stdout }}"

  - name: Log auditd version
    debug:
      msg: "Auditd version is {{ auditd_major_minor_version }}"

  - name: Set auditd log_format
    set_fact:
      log_format_value: "{{ 'ENRICHED' if auditd_major_minor_version >= '2.8' else 'RAW' }}"

  # Daemon CPU/concurrency tuning (recovered from the PaaS collector line).
  # priority_boost is auditd's scheduling-priority boost (default 4). The old
  # value 8 made auditd preempt application threads and waste host CPU under
  # load; drop it back to 4 (2 for the low profile). See --backlog_wait_time 0
  # in the rules files for the paired kernel-side stall fix.
  - name: Set auditd priority_boost (medium/high default)
    set_fact:
      priority_boost_value: "4"

  - name: Lower auditd priority_boost for the low profile
    set_fact:
      priority_boost_value: "2"
    when: hyperi_audit_level == 'low'

  # flush=incremental_async is the modern default and the highest-performance
  # durable mode (async fsync). incremental_async needs audit >= 2.6, so el6
  # (audit 2.4.x) falls back to plain incremental. freq raises the records-per-
  # flush count to cut fsync-induced iowait on the log write path.
  - name: Set auditd flush mode by version (async where supported)
    set_fact:
      flush_value: "{{ 'incremental_async' if auditd_major_minor_version >= '2.6' else 'incremental' }}"

  - name: Configure auditd.conf
    lineinfile:
      state: present
      path: "{{ auditd_path.files[0].path }}"
      regexp: '^\s*{{ item.search }}\s*=\s*.*'
      line: '{{ item.replace }}'
    with_items:
      - { search: 'name_format', replace: 'name_format = hostname' }
      - { search: 'priority_boost', replace: "priority_boost = {{ priority_boost_value }}" }
      - { search: 'log_group ', replace: 'log_group = root' }
      - { search: 'log_format', replace: "log_format = {{ log_format_value }}" }
      - { search: 'max_log_file_action', replace: "max_log_file_action = ROTATE" }
      - { search: 'max_log_file', replace: "max_log_file = 100" }
      - { search: 'num_logs', replace: "num_logs = 5" }
      - { search: 'flush', replace: "flush = {{ flush_value }}" }
      - { search: 'freq ', replace: "freq = 200" }
    when: auditd_path.files | length > 0

  - name: Set default auditd rules path
    set_fact:
      auditd_default_rules: "{{ '/etc/audit/audit.rules' if auditd_major_version == '1' else '/etc/audit/rules.d/audit.rules' }}"

  - name: Set default auditd rules present
    stat:
      path: "{{ auditd_default_rules }}"
    register: auditd_default_rules_present

  - name: Rename default audit.rules if present
    copy:
      remote_src: True
      src: "{{ auditd_default_rules }}"
      dest: "{{ auditd_default_rules }}.default"
    when: auditd_default_rules_present.stat.exists

  - name: Set new auditd rules path
    set_fact:
      auditd_new_rules: "{{ '/etc/audit/audit.rules' if auditd_major_version == '1' else '/etc/audit/rules.d/hyperi-audit.rules' }}"

  - name: Select the auditd rules source file for the profile level
    set_fact:
      auditd_rules_file: "hyperi-audit-{{ hyperi_audit_level }}.rules"

  - name: Override the rules source file with a use-case overlay when set
    set_fact:
      auditd_rules_file: "hyperi-audit-{{ hyperi_audit_use_case }}.rules"
    when: hyperi_audit_use_case is defined and hyperi_audit_use_case | length > 0

  - name: Copy new auditd rules
    copy:
      src: "{{ auditd_rules_file }}"
      dest: "{{ auditd_new_rules }}"
      owner: root
      group: root
      mode: '0644'

  - name: Check for sysctl auditd
    stat:
      path: /usr/lib/systemd/system/auditd.service
    register: sysctl_auditd

  # Paired with "Remove audit stop temporarily" in the service block below, which
  # puts RefuseManualStop back to yes. BOTH must carry the same
  # hyperi_audit_start_services gate: the revert lives inside that block, so
  # permitting unconditionally would leave the systemd protection disabled
  # forever in config-only mode.
  - name: Permit audit stop temporarily for systemctl
    lineinfile:
      state: present
      path: /usr/lib/systemd/system/auditd.service
      regexp: '^\s*{{ item.search }}\s*=\s*.*'
      line: '{{ item.replace }}'
    with_items:
      - { search: 'RefuseManualStop', replace: 'RefuseManualStop=no' }
    when: sysctl_auditd.stat.exists and hyperi_audit_start_services | default(true) | bool

  - name: Configure SELinux
    block:

    - name: SELinux allow rsyslog to send to TCP/12201
      shell: 'semanage port -a -t syslogd_port_t -p tcp 12201'
      register: semanage_result
      failed_when: semanage_result.rc != 0 and "already defined" not in semanage_result.stderr

    - name: SELinux allow rsyslog to send to TCP/12205
      shell: 'semanage port -a -t syslogd_port_t -p tcp 12205'
      register: semanage_result_12205
      failed_when: semanage_result_12205.rc != 0 and "already defined" not in semanage_result_12205.stderr

    - name: Create an SELinux build directory
      ansible.builtin.file:
        path: /tmp/rsyslog_audit
        state: directory
        mode: '0755'
        owner: root
        group: root
      when: ansible_selinux is defined and ansible_selinux != False and ansible_selinux.status == 'enabled'

    - name: Copy SELinux rsyslog audit log policy file
      copy:
        src: rsyslog_read_audit_logs.te
        dest: /tmp/rsyslog_audit/rsyslog_read_audit_logs.te
        owner: root
        group: root
        mode: '0600'

    - name: Make SELinux rsyslog audit log policy
      shell: 'cd /tmp/rsyslog_audit && make -f /usr/share/selinux/devel/Makefile rsyslog_read_audit_logs.pp'

    - name: Install SELinux rsyslog audit log policy
      shell: 'semodule -i /tmp/rsyslog_audit/rsyslog_read_audit_logs.pp'

    - name: Tidy up an SELinux build directory
      ansible.builtin.file:
        path: /tmp/rsyslog_audit
        state: absent

    when: ansible_selinux is defined and ansible_selinux != False and ansible_selinux.status == 'enabled'

  # Service management (enable/start/stop of auditd + rsyslog). Gated by
  # hyperi_audit_start_services (default true = normal deploy). The Docker test
  # harness sets it false to run config-only in a plain container that has no
  # init to drive the service module, then starts rsyslogd itself and seeds
  # audit.log to prove forwarding.
  - name: Manage auditd and rsyslog services
    when: hyperi_audit_start_services | default(true) | bool
    block:

    - name: Daemon reload
      service:
        daemon_reload: yes
      when: daemon_type == 'systemd'

    - name: Enable rsyslog
      service:
        name: rsyslog
        enabled: yes

    - name: Enable auditd
      service:
        name: auditd
        enabled: yes

    # The auditd restart is DELIBERATELY NOT gated on found_immutable_auditd.
    #
    # The payload of a run splits in two, and immutability only blocks HALF of it:
    #   * auditd.conf (priority_boost / flush / freq / log_format) is DAEMON
    #     config, read at daemon start. It applies on this restart even when the
    #     kernel audit config is locked.
    #   * the .rules file (--backlog_wait_time et al) is KERNEL state. Under
    #     "-e 2" it cannot load until reboot, restart or no restart.
    # Skipping the restart when immutable therefore stranded the daemon-side CPU
    # fix for no benefit -- and because every ruleset we ship ENDS with "-e 2",
    # the host is immutable on every deploy after the first, so it was stranded
    # on every host that had already run this role. Restart regardless; the
    # rules land at the next reboot.
    #
    # UNVERIFIED, and it must be proven on a real host before fleet rollout
    # (plan P3): whether "stop auditd" is refused under "-e 2" on the older
    # auditd versions in range. A container cannot answer this -- audit netlink
    # is host-global, so the harness never runs this block at all. If a stop IS
    # refused here, this task fails LOUDLY, which is the intended trade: a
    # visible failure beats silently not applying the fix.
    - name: Stop auditd
      service:
        name: auditd
        state: stopped

    - name: Stop rsyslog
      service:
        name: rsyslog
        state: stopped

    - name: Remove audit stop temporarily for systemctl
      lineinfile:
        state: present
        path: /usr/lib/systemd/system/auditd.service
        regexp: '^\s*{{ item.search }}\s*=\s*.*'
        line: '{{ item.replace }}'
      with_items:
        - { search: 'RefuseManualStop', replace: 'RefuseManualStop=yes' }
      when: sysctl_auditd.stat.exists

    - name: Start auditd
      service:
        name: auditd
        state: started

    - name: Start rsyslog
      service:
        name: rsyslog
        state: started

  become: yes
  become_user: root
