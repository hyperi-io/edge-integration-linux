---
- name: Read the init system
  ansible.builtin.command:
    argv: [ps, -p, "1", -o, comm=]
  register: hyperi_audit_init
  changed_when: false

- name: Enable rsyslog and auditd at boot
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
  loop: [rsyslog, auditd]

- name: Start rsyslog and auditd
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
  loop: [rsyslog, auditd]

# A run that failed after writing config never reached its restart, so the
# restart is decided from the host's state as well as this run's changes.
- name: Read when each service last started
  ansible.builtin.command:
    argv: [systemctl, show, --value, -p, ActiveEnterTimestamp, "{{ item }}"]
  loop: [auditd, rsyslog]
  register: hyperi_audit_started
  changed_when: false
  when: hyperi_audit_init.stdout == 'systemd'

- name: Find config written since its service started
  ansible.builtin.command:
    argv: "{{ ['find'] + hyperi_audit_service_files[item.item] + ['-newermt', item.stdout] }}"
  loop: "{{ hyperi_audit_started.results | default([]) | selectattr('stdout', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: hyperi_audit_stale
  changed_when: false
  failed_when: false
  vars:
    hyperi_audit_service_files:
      auditd: [/etc/audit/auditd.conf]
      rsyslog: [/etc/rsyslog.conf, /etc/rsyslog.d/99-hyperi-rsyslog.conf]

# augenrules --check compares rules.d with the ruleset the last load built.
- name: Check whether rules.d differs from the loaded ruleset
  ansible.builtin.command:
    argv: [augenrules, --check]
  register: hyperi_audit_rules_check
  changed_when: false
  failed_when: false

- name: Decide whether to restart
  ansible.builtin.set_fact:
    hyperi_audit_restart_needed: >-
      {{ (hyperi_audit_restart_needed | default(false) | bool)
         or (hyperi_audit_stale.results | default([])
             | selectattr('stdout', 'defined') | selectattr('stdout') | list | length > 0)
         or (hyperi_audit_started.results | default([])
             | selectattr('stdout', 'defined') | rejectattr('stdout') | list | length > 0)
         or (hyperi_audit_rules_check.stdout is search('should be updated')) }}

- name: Restart the services when the config changed
  ansible.builtin.include_tasks: restart.yml
  when: hyperi_audit_restart_needed | bool
